# ============================================================
# InvenTree — Fixture base para Pruebas de Sistema
# ============================================================
# Cubre los datos mínimos requeridos por TODAS las suites:
#   - inventree_test_suite.py                          (CPF-001 Login + CPF-002 Partes)
#   - inventree_stock_test_suite.py                    (CPF-003 Stock + Transferencias)
#   - inventree_categories_suppliers_test_suite.py      (CPF-006 Categorías + CPF-007 Proveedores)
#   - inventree_po_bom_build_test_suite.py              (CPF-004 PO + CPF-005 BOM + CPF-008 Builds)
#   - inventree_sales_returns_test_suite.py             (ST-008 SO + ST-009 RO)
#   - inventree_permissions_traceability_test_suite.py  (ST-003 Permisos + ST-010 Trazabilidad + ST-012 Plugins)
#   - inventree_golden_path_test_suite.py               (ST-013 Golden Path E2E)
#
# Es la ÚNICA fuente de verdad para estos datos: setup_system_tests.py
# lo carga con `loaddata` en vez de recrear los registros a mano.
#
# Cargar manualmente con:
#   python src/backend/InvenTree/manage.py loaddata fixtures/system_test_base.yaml
# o (recomendado, incluye verificación):
#   python setup_system_tests.py
# ============================================================

