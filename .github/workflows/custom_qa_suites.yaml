# Suites de pruebas propias (Hito 2) — funcionales, integración y sistema.
#
# A diferencia de qc_checks.yaml (que corre el test runner interno de Django,
# `invoke dev.test`, contra la base de código), este workflow corre las
# suites black-box propias en tests/{funcionales,integracion,sistema}/ contra
# una instancia real de InvenTree levantada con `start_inventree.py`, tal
# como se ejecutan en local.
#
# Estructura del grafo (un job por módulo/suite, en vez de un único job
# secuencial, para que la vista de Actions muestre el desglose de un
# vistazo -- a costa de repetir el setup en cada job hoja, ya que cada uno
# corre en un runner nuevo e independiente, con su propia base de datos):
#
#   inicio (chequeo rápido, sin install)
#     ├─ test_modulos (puerta) -> part, stock, order, build, company, users
#     └─ test_sistema (puerta) -> integracion, golden_path, seguridad, desempeno

name: Custom QA Suites

on:
  push:
    branches-ignore: ["l10*", "dependabot/**", "backport/**"]
    paths:
      - "tests/**"
      - "start_inventree.py"
      - "setup_system_tests.py"
      - "src/backend/InvenTree/**"
  pull_request:
    branches-ignore: ["l10*"]
    paths:
      - "tests/**"
      - "start_inventree.py"
      - "setup_system_tests.py"
      - "src/backend/InvenTree/**"
  workflow_dispatch:

env:
  python_version: 3.12

permissions:
  contents: read

jobs:
  inicio:
    name: "Inicio (chequeo rápido)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.python_version }}

      - name: Verificar sintaxis de start_inventree.py
        run: python3 -c "import ast; ast.parse(open('start_inventree.py').read())"

  test_modulos:
    name: "Test módulos (puerta)"
    runs-on: ubuntu-24.04
    needs: inicio
    steps:
      - run: echo "Disparando suites funcionales por módulo..."

  test_sistema:
    name: "Test sistema (puerta)"
    runs-on: ubuntu-24.04
    needs: inicio
    steps:
      - run: echo "Disparando suites de integración y sistema..."

  part:
    name: "Funcionales: part (FN1 Partes + FN6 Categorías + FN5 BOM)"
    runs-on: ubuntu-24.04
    needs: test_modulos

    env:
      INVENTREE_DB_ENGINE: django.db.backends.postgresql
      INVENTREE_DB_NAME: inventree
      INVENTREE_DB_USER: inventree
      INVENTREE_DB_PASSWORD: password
      INVENTREE_DB_HOST: "127.0.0.1"
      INVENTREE_DB_PORT: 5432
      INVENTREE_CACHE_HOST: localhost
      INVENTREE_CACHE_PORT: 6379
      INVENTREE_MEDIA_ROOT: /home/runner/work/InvenTree-VIUDANEGRA/test_inventree_media-part
      INVENTREE_STATIC_ROOT: /home/runner/work/InvenTree-VIUDANEGRA/test_inventree_static-part
      INVENTREE_BACKUP_DIR: /home/runner/work/InvenTree-VIUDANEGRA/test_inventree_backup-part
      INVENTREE_DEBUG: true
      INVENTREE_LOG_LEVEL: WARNING
      INVENTREE_CONSOLE_LOG: false
      INVENTREE_SITE_URL: http://localhost:8000

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inventree
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432

      redis:
        image: redis:8
        ports:
          - 6379:6379

    steps:
      # Pasos de entorno en línea (no se reutiliza ./.github/actions/setup):
      # ese composite action solo existe si se clonó/copió el árbol COMPLETO
      # de InvenTree. Como este workflow puede vivir en una copia parcial del
      # repo (solo las carpetas de pruebas + CI), se evita esa dependencia.
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.python_version }}
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext poppler-utils libpq-dev

      - name: Instalar dependencias de Python
        run: |
          python3 -m pip install -U pip
          pip3 install -U invoke wheel
          pip3 install 'uv>=0.9.6'
          export UV_SYSTEM_PYTHON=1
          echo "UV_SYSTEM_PYTHON=1" >> "$GITHUB_ENV"
          uv pip install --system psycopg 'django-redis>=5.0.0' playwright

      - name: invoke install --dev
        run: invoke install --dev

      - name: invoke install
        run: invoke install

      - name: invoke migrate
        run: invoke migrate

      - name: invoke static --skip-plugins
        run: invoke static --skip-plugins

      - name: Install Playwright browser (Chromium)
        run: playwright install --with-deps chromium

      - name: "Ejecutar suite: part (con coverage)"
        run: python3 start_inventree.py --suite part --coverage

      - name: Subir evidencia (screenshots + resultados JSON)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test_output-part
          path: test_output/
          retention-days: 14

      - name: Subir datos crudos de coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-part
          path: .coverage*
          retention-days: 14
          include-hidden-files: true

